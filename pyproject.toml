[project]
name = "comfyui-rs-multicharacter-sampler"
version = "0.1.6"
description = "Anima, SDXL, Krea 2 and MOSS Zeta: multi-character regional sampling and local masked detailing, automatic character matching, detection and tagger loaders, PNG/WebP metadata and prompt restoration. Adds per-character LoRA selection, masked model hooks and metadata restoration alongside mixed point/box layouts, text regions and editable presets. SD1.5 generation is experimental and unstable."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy", "Pillow>=10.0", "torch"]
classifiers = ["Development Status :: 4 - Beta"]

[project.optional-dependencies]
detailer = ["opencv-python>=4.8", "scipy>=1.11", "timm>=1.0.3,<2", "huggingface-hub>=1.1,<2", "safetensors>=0.4"]

[project.urls]
Repository = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler"
Issues = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler/issues"
Documentation = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler#readme"

[tool.comfy]
PublisherId = "raspie10032"
DisplayName = "RS MultiCharacter Sampler (Zeta)"
