[project]
name = "comfyui-rs-multicharacter-sampler"
version = "1.0.8"
description = "Hangeul: regional generation and detailing for Anima, SDXL, Krea 2, MOSS and FLUX, with character LoRAs, editable masks, camera control and progressive sampling. Experimental 3D rig/mask editor, Anima 2B pose-adapter integration and regional image references; SD1.5 is unstable."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy", "Pillow>=10.0", "torch"]
classifiers = ["Development Status :: 5 - Production/Stable"]

[project.optional-dependencies]
detailer = ["opencv-python>=4.8", "scipy>=1.11", "timm>=1.0.3,<2", "huggingface-hub>=1.1,<2", "safetensors>=0.4"]
reference = ["einops>=0.8", "transformers>=4.50,<6", "huggingface-hub>=1.1,<2", "safetensors>=0.4"]

[project.urls]
Repository = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler"
Issues = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler/issues"
Documentation = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler#readme"

[tool.comfy]
PublisherId = "raspie10032"
DisplayName = "RS MultiCharacter Sampler (Hangeul)"
