[project]
name = "comfyui-rs-multicharacter-sampler"
version = "0.2.5"
description = "Mieum: optional experimental per-character image references, supported but not recommended. Modular regional generation and detailing, draggable point/box/mask placement, per-character LoRA and PNG/WebP settings for Anima, SDXL, Krea 2, MOSS and FLUX.1/2/3. SD1.5 is experimental and unstable."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy", "Pillow>=10.0", "torch"]
classifiers = ["Development Status :: 4 - Beta"]

[project.optional-dependencies]
detailer = ["opencv-python>=4.8", "scipy>=1.11", "timm>=1.0.3,<2", "huggingface-hub>=1.1,<2", "safetensors>=0.4"]
reference = ["einops>=0.8", "transformers>=4.50,<6", "huggingface-hub>=1.1,<2", "safetensors>=0.4"]

[project.urls]
Repository = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler"
Issues = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler/issues"
Documentation = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler#readme"

[tool.comfy]
PublisherId = "raspie10032"
DisplayName = "RS MultiCharacter Sampler (Mieum)"
