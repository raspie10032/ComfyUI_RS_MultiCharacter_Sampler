[project]
name = "comfyui-rs-multicharacter-sampler"
version = "0.2.0"
description = "Giyeok: modular character prompt, LoRA and position nodes with order-independent pipe assembly and layout previews. Multi-character regional sampling and local masked detailing for Anima, SDXL, Krea 2 and MOSS, with per-character LoRAs, automatic matching, detector/tagger loaders, PNG/WebP settings restoration, mixed point/box layouts, text regions and editable presets. SD1.5 generation is experimental and unstable."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy", "Pillow>=10.0", "torch"]
classifiers = ["Development Status :: 4 - Beta"]

[project.optional-dependencies]
detailer = ["opencv-python>=4.8", "scipy>=1.11", "timm>=1.0.3,<2", "huggingface-hub>=1.1,<2", "safetensors>=0.4"]

[project.urls]
Repository = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler"
Issues = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler/issues"
Documentation = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler#readme"

[tool.comfy]
PublisherId = "raspie10032"
DisplayName = "RS MultiCharacter Sampler (Giyeok)"
