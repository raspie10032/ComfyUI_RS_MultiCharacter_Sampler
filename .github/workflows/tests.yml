name: Compatibility tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            comfy: v0.3.76
          - os: ubuntu-latest
            comfy: 5cc4b870094c89090db54bd8d12649dcaf89f2ba
          - os: windows-latest
            comfy: 5cc4b870094c89090db54bd8d12649dcaf89f2ba
          - os: ubuntu-latest
            comfy: 355cd6b14c92c19ac3188fe528e47a3f21ef5178
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      RS_MC_TEST_COMFYUI: ${{ github.workspace }}/_comfyui
      RS_MC_TEST_GGUF: ${{ github.workspace }}/_gguf
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ matrix.comfy }}
          path: _comfyui
      - uses: actions/checkout@v7
        with:
          repository: city96/ComfyUI-GGUF
          ref: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a
          path: _gguf
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install CPU runtime
        run: python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        run: python -m pip install -r _comfyui/requirements.txt opencv-python-headless gguf==0.19.0
      - name: Python tests and native ComfyUI integrations
        run: python -m unittest discover -s tests -v
      - name: Character UI serialization and controls
        run: node tests/test_ui.cjs
      - name: Box layout controls and preview
        run: node tests/test_boxes_ui.cjs
      - name: Detailer UI serialization and controls
        run: node tests/test_detailer_ui.cjs
      - name: Model family presets and manual settings
        run: node tests/test_presets_ui.cjs
      - name: Modular character builder ordering and layout
        run: node tests/test_builder_ui.cjs
      - name: Localized selection help and serialization
        run: node tests/test_node_help_ui.cjs
      - name: Metadata character count notice
        run: node tests/test_metadata_notice_ui.cjs
      - name: Interaction preset controls and help ordering
        run: node tests/test_interaction_ui.cjs
      - name: Delayed localized control tooltips
        run: node tests/test_widget_tooltips_ui.cjs
      - name: Character mask previews and input invalidation
        run: node tests/test_mask_preview_ui.cjs
      - name: Numbered point box and mask placement editor
        run: node tests/test_position_editor_ui.cjs
      - name: OpenPose masks and connected input previews
        run: node tests/test_pose_masks_ui.cjs
      - name: Chinese locale catalogs and fallback coverage
        run: node tests/test_localization_ui.cjs
